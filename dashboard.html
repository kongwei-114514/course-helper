<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Helper - 清华选课助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #4CAF50;
      --primary-dark: #45a049;
      --primary-light: #e8f5e9;
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --text: #333333;
      --text-light: #666666;
      --border: #e0e0e0;
      --shadow: 0 2px 8px rgba(0,0,0,0.1);
      --danger: #dc3545;
      --danger-bg: #fff0f0;
      --warning: #856404;
      --warning-bg: #fff3cd;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== 导航栏 ===== */
    .navbar {
      background: var(--card-bg);
      padding: 1rem 2rem;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .navbar-left { display: flex; align-items: center; gap: 1.5rem; }
    .navbar-brand { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
    .page-tabs { display: flex; gap: 0.3rem; }
    .page-tab {
      padding: 0.45rem 1.1rem;
      border: 1px solid var(--border);
      background: transparent; border-radius: 6px; cursor: pointer;
      font-size: 0.9rem; color: var(--text-light); transition: all 0.2s;
    }
    .page-tab:hover { border-color: var(--primary); color: var(--primary); }
    .page-tab.active { background: var(--primary); color: white; border-color: var(--primary); }

    .navbar-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .btn {
      padding: 0.6rem 1.2rem; border: none; border-radius: 6px; cursor: pointer;
      font-size: 0.9rem; transition: all 0.3s; display: flex; align-items: center; gap: 0.5rem;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
    .btn-outline:hover { background: var(--primary-light); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ===== 页面切换 ===== */
    .page { display: none; }
    .page.active { display: block; }

    /* ===== 培养方案页（原版完整保留）===== */
    .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .stat-card { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; box-shadow: var(--shadow); }
    .stat-label { color: var(--text-light); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .stat-value { font-size: 2rem; font-weight: bold; color: var(--primary); }
    .stat-sub { color: var(--text-light); font-size: 0.85rem; margin-top: 0.5rem; }
    .progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; }
    .main-content { display: grid; grid-template-columns: 350px 1fr; gap: 2rem; }
    .sidebar { background: var(--card-bg); border-radius: 12px; padding: 1.5rem; box-shadow: var(--shadow); max-height: calc(100vh - 200px); overflow-y: auto; }
    .sidebar-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem; color: var(--text); }
    .filter-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab { padding: 0.5rem 1rem; border: 1px solid var(--border); background: transparent; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.3s; }
    .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .group-list { display: flex; flex-direction: column; gap: 0.8rem; }
    .group-item { padding: 1rem; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.3s; }
    .group-item:hover { border-color: var(--primary); background: var(--primary-light); }
    .group-item.active { border-color: var(--primary); background: var(--primary-light); }
    .group-item.completed { opacity: 0.6; }
    .group-name { font-weight: bold; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    .group-progress { font-size: 0.85rem; color: var(--text-light); }
    .badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-success { background: #d4edda; color: #155724; }
    .badge-warning { background: #fff3cd; color: #856404; }
    .detail-panel { background: var(--card-bg); border-radius: 12px; padding: 2rem; box-shadow: var(--shadow); }
    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-light); }
    .empty-state-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.3; }
    .course-grid { display: grid; gap: 1rem; }
    .course-card { border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem; transition: all 0.3s; cursor: pointer; }
    .course-card:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(76,175,80,0.15); }
    .course-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem; }
    .course-title { font-weight: bold; font-size: 1.1rem; }
    .course-id { color: var(--text-light); font-size: 0.85rem; }
    .course-info { display: flex; gap: 1.5rem; margin-top: 0.8rem; font-size: 0.9rem; color: var(--text-light); }
    .course-info-item { display: flex; align-items: center; gap: 0.3rem; }
    .loading { display: flex; justify-content: center; align-items: center; padding: 3rem; }
    .spinner { border: 3px solid var(--border); border-top: 3px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

    /* 模态框（培养方案 + 选课评价共用） */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; padding: 2rem; overflow-y: auto; }
    .modal.show { display: flex; justify-content: center; align-items: flex-start; }
    .modal-content { background: var(--card-bg); border-radius: 12px; padding: 2rem; max-width: 800px; width: 100%; margin-top: 2rem; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-light); }
    .comments-section { margin-top: 1.5rem; }
    .comment-item { padding: 1rem; border-left: 3px solid var(--primary); background: var(--primary-light); border-radius: 4px; margin-bottom: 1rem; }
    .comment-rating { color: #FFC107; font-weight: bold; margin-bottom: 0.5rem; }

    /* ===== 选课规划页 ===== */
    .sp-wrap { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem; }
    .sp-layout { display: grid; grid-template-columns: 380px 1fr; gap: 1.5rem; align-items: start; }

    /* 左侧面板 */
    .sp-panel {
      background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow);
      overflow: visible; display: block;
    }
    .sp-panel-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sp-panel-title { font-size: 1.1rem; font-weight: bold; color: var(--text); margin-bottom: 0.75rem; }
    .sp-notice { background: var(--warning-bg); border: 1px solid #ffc107; border-radius: 6px; padding: 0.6rem 0.8rem; margin-bottom: 0.75rem; font-size: 0.82rem; color: var(--warning); line-height: 1.6; }
    .sp-view-tabs { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; }
    .sp-vtab { flex: 1; padding: 0.45rem 0.5rem; border: 1px solid var(--border); background: transparent; border-radius: 6px; cursor: pointer; font-size: 0.85rem; color: var(--text-light); transition: all 0.2s; text-align: center; font-family: inherit; }
    .sp-vtab:hover { border-color: var(--primary); color: var(--primary); }
    .sp-vtab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .sp-vtab-count { background: rgba(255,255,255,0.3); border-radius: 8px; padding: 0 5px; font-size: 0.75rem; }
    .sp-vtab:not(.active) .sp-vtab-count { background: var(--border); color: var(--text-light); }
    .sp-search { width: 100%; padding: 0.55rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; outline: none; font-family: inherit; transition: border-color 0.2s; }
    .sp-search:focus { border-color: var(--primary); }
    .sp-filter-select { width: 100%; padding: 0.5rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; color: var(--text-light); font-family: inherit; outline: none; cursor: pointer; }
    .sp-search-controls { display: grid; grid-template-columns: 1fr 112px; gap: 0.5rem; }
    .sp-search-type { width: 100%; padding: 0.55rem 0.55rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; color: var(--text-light); font-family: inherit; outline: none; cursor: pointer; background: #fff; }
    .sp-search-type:focus { border-color: var(--primary); }

    .sp-list { overflow: visible; padding: 0.75rem; }
    .sp-empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-light); }
    .sp-empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }

    /* 课程组（同门课多个班） */
    .sp-cgroup { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.6rem; overflow: hidden; transition: border-color 0.2s; }
    .sp-cgroup:hover { border-color: #bbb; }
    .sp-cgroup.has-selected { border-color: var(--primary); }
    .sp-cgroup-hd { display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem 0.9rem; cursor: pointer; user-select: none; }
    .sp-cgroup-hd:hover { background: #fafafa; }
    .sp-color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(0,0,0,0.03); }
    .sp-cname-wrap { flex: 1; min-width: 0; }
    .sp-cname { font-weight: 600; font-size: 0.9rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .sp-cid { font-size: 0.78rem; color: var(--text-light); }
    .sp-cmeta { display: flex; align-items: center; justify-content: flex-end; gap: 0.4rem; flex: 0 0 auto; flex-wrap: wrap; max-width: 48%; }
    .sp-crating { font-size: 0.78rem; color: #e6a817; font-weight: 600; }
    .sp-ccount { font-size: 0.78rem; color: var(--text-light); }
    .sp-ctag { font-size: 0.72rem; padding: 0.1rem 0.45rem; background: var(--primary); color: white; border-radius: 4px; }
    .sp-type-section { display: flex; align-items: center; gap: 0.45rem; margin: 0.85rem 0 0.45rem; color: var(--text-light); font-size: 0.78rem; font-weight: 700; }
    .sp-type-section::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--type-color); }
    .sp-type-section:first-child { margin-top: 0.15rem; }
    .sp-search-section { --type-color: #9ca3af; }
    .sp-type-tag { font-size: 0.72rem; padding: 0.1rem 0.45rem; border-radius: 4px; white-space: nowrap; background: var(--type-bg); color: var(--type-text); border: 1px solid var(--type-border); font-weight: 600; }
    .sp-review-tag { font-size: 0.72rem; padding: 0.1rem 0.45rem; border-radius: 4px; white-space: nowrap; }
    .sp-review-tag.has-review { background: #fff3cd; color: #856404; }
    .sp-review-tag.no-review { background: #f0f0f0; color: #aaa; }
    .sp-chevron { font-size: 0.75rem; color: var(--text-light); transition: transform 0.2s; }
    .sp-chevron.open { transform: rotate(180deg); }

    /* 班级实例 */
    .sp-insts { padding: 0 0.75rem 0.75rem; display: none; }
    .sp-insts.open { display: block; }
    .sp-inst { border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem 0.9rem; margin-bottom: 0.5rem; transition: all 0.2s; }
    .sp-inst.is-sel { border-color: var(--primary); background: var(--primary-light); }
    .sp-inst.is-conflict { border-color: var(--danger); background: var(--danger-bg); }
    .sp-inst.would-conflict { border-color: #ffc107; }
    .sp-inst-r1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
    .sp-tname { font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .sp-credits-tag { font-size: 0.78rem; padding: 0.1rem 0.5rem; background: #f0f0f0; border-radius: 4px; color: var(--text-light); }
    .sp-inst-time { font-size: 0.82rem; color: var(--text-light); margin-bottom: 0.4rem; line-height: 1.5; }
    .sp-inst-time.no-time { font-style: italic; }
    .sp-enroll-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.45rem; font-size: 0.78rem; }
    .sp-enroll-main { color: #2563eb; font-weight: 700; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 4px; padding: 0.1rem 0.4rem; }
    .sp-pref-list { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .sp-pref-pill { color: #475569; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; padding: 0.1rem 0.35rem; white-space: nowrap; }
    .sp-pref-pill.active { color: #1d4ed8; background: #dbeafe; border-color: #60a5fa; box-shadow: inset 0 0 0 1px #93c5fd; font-weight: 700; }
    .sp-prob-pill { font-weight: 700; border-radius: 4px; padding: 0.1rem 0.4rem; border: 1px solid transparent; }
    .sp-prob-pill.high { color: #166534; background: #dcfce7; border-color: #86efac; }
    .sp-prob-pill.mid { color: #92400e; background: #fef3c7; border-color: #fcd34d; }
    .sp-prob-pill.low { color: #991b1b; background: #fee2e2; border-color: #fca5a5; }
    .sp-cap-row { font-size: 0.8rem; margin-bottom: 0.5rem; display: flex; gap: 0.75rem; align-items: center; }
    .cap-ok { color: #28a745; } .cap-low { color: #e6a817; } .cap-full { color: var(--danger); }
    .sp-grade-limit { color: var(--text-light); font-size: 0.78rem; background: #f0f0f0; padding: 0.1rem 0.4rem; border-radius: 4px; }
    .sp-limit-tag { color: #7c3aed; font-size: 0.78rem; background: #f4f0ff; border: 1px solid #ddd1ff; padding: 0.1rem 0.4rem; border-radius: 4px; }
    .sp-conflict-warn { font-size: 0.8rem; color: var(--danger); margin-bottom: 0.4rem; }
    .sp-would-warn { font-size: 0.8rem; color: #856404; margin-bottom: 0.4rem; }
    .sp-inst-btns { display: flex; gap: 0.5rem; }
    .sp-btn { padding: 0.42rem 0.6rem; border: 1px solid var(--border); border-radius: 5px; background: transparent; cursor: pointer; font-size: 0.82rem; font-family: inherit; transition: all 0.2s; color: var(--text-light); flex: 1; }
    .sp-btn.add:hover { background: var(--primary); border-color: var(--primary); color: white; }
    .sp-btn.remove { border-color: #ddd; }
    .sp-btn.remove:hover { background: var(--danger); border-color: var(--danger); color: white; }
    .sp-btn.review { border-color: #ffc107; color: #856404; flex: 0 0 auto; }
    .sp-btn.review:hover { background: var(--warning-bg); }

    /* 右侧 */
    .sp-right { display: flex; flex-direction: column; gap: 1rem; }
    .sp-stats-bar { background: var(--card-bg); border-radius: 12px; padding: 1rem 1.5rem; box-shadow: var(--shadow); display: flex; align-items: center; gap: 2rem; }
    .sp-stat { display: flex; align-items: baseline; gap: 0.4rem; }
    .sp-stat-val { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
    .sp-stat-label { font-size: 0.85rem; color: var(--text-light); }
    .sp-stat.conflict .sp-stat-val { color: var(--danger); }
    .sp-stat.ok .sp-stat-val { color: #28a745; font-size: 1.4rem; }
    .sp-stat-actions { margin-left: auto; display: flex; gap: 0.75rem; }
    .sp-act-btn { padding: 0.55rem 1.1rem; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-light); cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: all 0.2s; }
    .sp-act-btn:hover { border-color: var(--primary); color: var(--primary); }
    .sp-act-btn.primary { background: var(--primary); border-color: var(--primary); color: white; }
    .sp-act-btn.primary:hover { background: var(--primary-dark); }

    /* 课表 */
    .sp-tt-card { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
    .sp-tt { width: 100%; border-collapse: collapse; table-layout: fixed; }
    /* 表头 */
    .sp-tt thead th {
      padding: 0.55rem 0.4rem; font-size: 0.88rem; font-weight: 600; color: var(--text-light);
      border-bottom: 2px solid var(--border); text-align: center; background: #fafafa;
    }
    .sp-tt thead th:first-child { width: 68px; }
    .sp-tt thead th.weekend { color: #bbb; }
    /* 时间列 */
    .sp-tt-timecell {
      padding: 3px 5px; text-align: center; vertical-align: middle;
      border-right: 2px solid var(--border); border-bottom: 1px solid var(--border);
      background: #fafafa;
    }
    .sp-period-lbl { font-size: 0.78rem; font-weight: 700; color: var(--text-light); display: block; }
    .sp-period-t { font-size: 0.68rem; color: #bbb; display: block; margin-top: 2px; }
    /* 课程格 */
    .sp-tt-cell {
      border: 1px solid var(--border); vertical-align: top;
      padding: 2px; position: relative;
    }
    .sp-tt-cell.weekend { background: #fdfdf9; }
    .sp-block {
      width: 100%; height: 100%; border-radius: 5px; padding: 4px 5px;
      cursor: pointer; transition: opacity 0.15s; overflow: hidden; position: relative;
    }
    .sp-block:hover { opacity: 0.82; }
    .sp-block.conflicting { outline: 2px solid var(--danger); outline-offset: -2px; }
    .sp-bname { font-size: 0.75rem; font-weight: 700; color: rgba(0,0,0,0.72); line-height: 1.3; }
    .sp-bteacher { font-size: 0.68rem; color: rgba(0,0,0,0.5); margin-top: 2px; }
    .sp-bqualifier { font-size: 0.62rem; color: rgba(0,0,0,0.38); }
    .sp-bconflict { position: absolute; top: 2px; right: 3px; font-size: 0.68rem; }

    /* 时间待定 */
    .sp-no-time { background: var(--card-bg); border-radius: 12px; padding: 1rem 1.5rem; box-shadow: var(--shadow); }
    .sp-no-time-title { font-size: 0.9rem; font-weight: 600; color: var(--text-light); margin-bottom: 0.75rem; }
    .sp-nt-item { display: flex; align-items: center; gap: 1rem; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.4rem; border-left-width: 3px; }
    .sp-nt-name { font-size: 0.9rem; font-weight: 600; flex: 1; }
    .sp-nt-teacher { font-size: 0.82rem; color: var(--text-light); }
    .sp-nt-credits { font-size: 0.78rem; color: var(--text-light); background: #f0f0f0; padding: 0.1rem 0.5rem; border-radius: 4px; }
    .sp-nt-rm { width: 22px; height: 22px; border: 1px solid var(--border); border-radius: 4px; background: transparent; cursor: pointer; font-size: 1rem; color: var(--text-light); transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .sp-nt-rm:hover { background: var(--danger); border-color: var(--danger); color: white; }

    /* 志愿填报 */
    .sp-pref-plan { background: var(--card-bg); border-radius: 12px; padding: 1rem 1.5rem; box-shadow: var(--shadow); }
    .sp-pref-plan-title { font-size: 0.9rem; font-weight: 600; color: var(--text-light); margin-bottom: 0.75rem; }
    .sp-pref-section { margin-top: 0.9rem; }
    .sp-pref-section:first-of-type { margin-top: 0; }
    .sp-pref-section-title { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding-bottom: 0.45rem; margin-bottom: 0.45rem; border-bottom: 1px solid var(--border); color: var(--text); font-size: 0.86rem; font-weight: 700; }
    .sp-pref-section-title::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--type-color); flex: 0 0 auto; }
    .sp-pref-section-title span:first-child { margin-right: auto; }
    .sp-pref-count { color: var(--text-light); font-size: 0.75rem; font-weight: 500; white-space: nowrap; }
    .sp-pref-items { display: grid; gap: 0.4rem; }
    .sp-pref-item { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(260px, auto) auto auto; align-items: center; gap: 0.7rem; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-left: 3px solid var(--course-color); border-radius: 6px; }
    .sp-pref-rank { min-width: 3.2rem; text-align: center; font-size: 0.75rem; font-weight: 700; border-radius: 4px; padding: 0.15rem 0.35rem; }
    .sp-pref-rank.rank1 { color: #166534; background: #dcfce7; }
    .sp-pref-rank.rank2 { color: #92400e; background: #fef3c7; }
    .sp-pref-rank.rank3 { color: #1d4ed8; background: #dbeafe; }
    .sp-pref-course { min-width: 0; }
    .sp-pref-name { color: var(--text); font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-pref-meta { color: var(--text-light); font-size: 0.76rem; margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-pref-side { display: grid; gap: 0.35rem; justify-items: end; }
    .sp-pref-cap { color: #2563eb; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 4px; padding: 0.12rem 0.45rem; white-space: nowrap; font-size: 0.75rem; font-weight: 700; }
    .sp-pref-cap.muted { color: var(--text-light); background: #f8fafc; border-color: #e2e8f0; font-weight: 500; }
    .sp-pref-matrix { display: grid; gap: 0.25rem; justify-items: end; }
    .sp-pref-matrix.muted { color: var(--text-light); background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; padding: 0.12rem 0.45rem; white-space: nowrap; font-size: 0.75rem; }
    .sp-pref-matrix-row { display: grid; grid-template-columns: 2.5rem auto; align-items: center; gap: 0.35rem; }
    .sp-pref-matrix-label { color: var(--text-light); font-size: 0.74rem; font-weight: 700; text-align: right; }
    .sp-pref-inline-list { display: flex; gap: 0.25rem; flex-wrap: nowrap; justify-content: flex-end; }
    .sp-pref-inline { color: #475569; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; padding: 0.12rem 0.38rem; white-space: nowrap; font-size: 0.75rem; font-weight: 600; }
    .sp-pref-inline.active { color: #1d4ed8; background: #dbeafe; border-color: #60a5fa; box-shadow: inset 0 0 0 1px #93c5fd; }
    .sp-pref-inline.muted { color: var(--text-light); font-weight: 500; }
    .sp-pref-prob { font-size: 0.76rem; font-weight: 700; border-radius: 4px; padding: 0.15rem 0.45rem; white-space: nowrap; border: 1px solid transparent; }
    .sp-pref-prob.high { color: #166534; background: #dcfce7; border-color: #86efac; }
    .sp-pref-prob.mid { color: #92400e; background: #fef3c7; border-color: #fcd34d; }
    .sp-pref-prob.low { color: #991b1b; background: #fee2e2; border-color: #fca5a5; }
    .sp-pref-prob.muted { color: var(--text-light); background: #f8fafc; border-color: #e2e8f0; font-weight: 500; }
    .sp-pref-actions { display: flex; gap: 0.3rem; }
    .sp-pref-rank-btn { width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 4px; background: #fff; color: var(--text-light); cursor: pointer; font-size: 0.78rem; font-weight: 700; line-height: 1; transition: all 0.2s; }
    .sp-pref-rank-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .sp-pref-rank-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .sp-pref-rank-btn:disabled:not(.active) { opacity: 0.35; cursor: not-allowed; }
    @media (max-width: 1180px) {
      .sp-pref-item { grid-template-columns: auto minmax(0, 1fr) auto; }
      .sp-pref-side { grid-column: 2 / -1; justify-items: start; }
      .sp-pref-matrix { justify-items: start; }
      .sp-pref-prob { justify-self: end; }
    }

    /* ===== 进度 Toast ===== */
    #progressToast { display: none; position: fixed; bottom: 24px; right: 24px; background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 16px 20px; min-width: 280px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 9999; }
    #progressToastTitle { font-weight: 600; margin-bottom: 8px; }
    #progressToastText { font-size: 0.85rem; color: #666; }
    .toast-bar { background: #f0f0f0; border-radius: 4px; height: 6px; margin-bottom: 8px; }
    #progressToastBar { background: #4f46e5; height: 6px; border-radius: 4px; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-left">
      <div class="navbar-brand">🎓 Course Helper</div>
      <div class="page-tabs">
        <button class="page-tab active" data-page="plan">📋 培养方案</button>
        <button class="page-tab" data-page="schedule">🗓️ 选课规划</button>
      </div>
    </div>
    <div class="navbar-actions">
      <button class="btn btn-outline" id="xuankeshequ">↗️ 进入选课社区贡献评价</button>
      <button class="btn btn-outline" id="refreshTrainingPlan">🔄 更新培养方案</button>
      <button class="btn btn-outline" id="refreshReviews">📊 更新选课评价</button>
      <button class="btn btn-outline" id="fetchNextSemester">📋 下学期推荐课</button>
      <button class="btn btn-outline" id="fetchCourseSchedule">🗓️ 抓取开课信息</button>
      <button class="btn btn-outline" id="fetchEnrollmentStats">📈 刷新选课人数</button>
      <button class="btn btn-primary" id="exportData">📥 导出数据</button>
    </div>
  </nav>

  <!-- 培养方案页（原版 HTML 结构，一字不改）-->
  <div class="page active" id="page-plan">
    <div class="container">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-label">总学分要求</div>
          <div class="stat-value" id="totalRequired">--</div>
          <div class="stat-sub">应完成学分</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">已完成学分</div>
          <div class="stat-value" id="totalCompleted">--</div>
          <div class="progress-bar">
            <div class="progress-fill" id="completionProgress" style="width: 0%"></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">剩余学分</div>
          <div class="stat-value" id="totalRemaining">--</div>
          <div class="stat-sub">还需完成</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">未完成课程组</div>
          <div class="stat-value" id="incompleteGroups">--</div>
          <div class="stat-sub">个课程组待修</div>
        </div>
      </div>
      <div class="main-content">
        <aside class="sidebar">
          <h2 class="sidebar-title">课程组</h2>
          <div class="filter-tabs">
            <button class="tab active" data-filter="all">全部</button>
            <button class="tab" data-filter="incomplete">未完成</button>
            <button class="tab" data-filter="required">必修</button>
            <button class="tab" data-filter="elective">限选</button>
          </div>
          <div class="group-list" id="groupList">
            <div class="loading"><div class="spinner"></div></div>
          </div>
        </aside>
        <main class="detail-panel">
          <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">📚</div>
            <h3>选择一个课程组查看详情</h3>
            <p>从左侧列表中选择课程组</p>
          </div>
          <div id="courseDetail" style="display: none;">
            <h2 id="groupTitle">课程组名称</h2>
            <div class="course-grid" id="courseGrid"></div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- 选课规划页 -->
  <div class="page" id="page-schedule">
    <div class="sp-wrap">
      <div class="sp-layout">
        <div class="sp-panel" id="spPanel">
          <div class="loading"><div class="spinner"></div></div>
        </div>
        <div class="sp-right" id="spRight">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 模态框（培养方案详情 + 选课评价共用）-->
  <div class="modal" id="courseModal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 id="modalCourseTitle">课程名称</h2>
          <div class="course-id" id="modalCourseId">课程号</div>
        </div>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div id="modalCourseInfo"></div>
      <div class="comments-section" id="modalComments"></div>
    </div>
  </div>

  <!-- 进度 Toast -->
  <div id="progressToast">
    <div id="progressToastTitle"></div>
    <div class="toast-bar"><div id="progressToastBar"></div></div>
    <div id="progressToastText"></div>
  </div>

  <script src="scripts/parser.js"></script>
  <script src="scripts/analyser.js"></script>
  <script src="scripts/exporter.js"></script>
  <script src="scripts/schedule-planner.js"></script>
  <script src="scripts/dashboard.js"></script>
  <script src="scripts/fetcher-ui.js"></script>
</body>
</html>
